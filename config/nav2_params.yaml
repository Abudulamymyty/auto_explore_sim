# =============================================================================
# Nav2 Parameters for TurtleBot3 Waffle Autonomous Exploration
# =============================================================================
# Robot specs: differential drive, radius ~0.22m, max linear 0.26 m/s
# Tuned for: office environment with narrow doorways (~0.8m wide)
# =============================================================================

# -----------------------------------------------------------------------------
# Behavior Tree Navigator
# Manages high-level navigation logic using behavior trees
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10                    # BT tick rate (ms)
    default_server_timeout: 20              # Timeout waiting for action servers (s)
    wait_for_service_timeout: 1000          # Timeout waiting for services (ms)
    action_server_result_timeout: 900.0     # How long to keep action results (s)
    # Use replanning + recovery BT so Nav2 retries on failures instead of aborting
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# -----------------------------------------------------------------------------
# Controller Server (MPPI)
# Computes velocity commands to follow the global path
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    controller_frequency: 25.0              # Faster control loop response (Hz)
    costmap_update_timeout: 0.20            # Faster timeout for stale costmap data (s)
    min_x_velocity_threshold: 0.001         # Below this = zero linear velocity
    min_y_velocity_threshold: 0.5           # N/A for diff drive (no lateral)
    min_theta_velocity_threshold: 0.001     # Below this = zero angular velocity
    # High tolerance: don't abort just because the planner/controller has
    # transient failures. Only give up when progress_checker says we're stuck.
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Checks if robot is making forward progress toward goal
    # Relaxed: give the robot more time to push through tight spots
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15        # Even tiny movement counts as progress (m)
      movement_time_allowance: 20.0         # 20s to move 0.15m — very patient

    # Determines when robot has "reached" the goal
    general_goal_checker:
      stateful: True                        # Once reached, stays reached
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5                # Position tolerance (m) - relaxed for frontiers
      yaw_goal_tolerance: 3.14              # Orientation tolerance (rad) - don't care about heading

    # MPPI (Model Predictive Path Integral) controller
    # Samples thousands of trajectories and picks the lowest-cost one
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.20
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      time_steps: 48                        # Shorter horizon for quicker local reaction
      model_dt: 0.04                        # 48*0.04 = 1.92s lookahead
      batch_size: 1000                      # Number of sampled trajectories per iteration
      # Acceleration limits
      ax_max: 2.5                           # Max forward acceleration (m/s²)
      ax_min: -2.5                          # Max braking deceleration (m/s²)
      ay_max: 1.0                           # Lateral accel (unused for DiffDrive)
      ay_min: -1.0
      az_max: 3.2                           # Max angular acceleration (rad/s²)
      # Noise standard deviations for trajectory sampling
      vx_std: 0.14                          # More exploratory linear samples
      vy_std: 0.1                           # Lateral velocity noise (unused)
      wz_std: 0.28                          # More exploratory angular samples
      # Velocity limits (TB3 Waffle hardware limits)
      vx_max: 1.0                        # Max forward speed (m/s)
      vx_min: -0.10                        # Barely allow reverse — forces rotate-in-place
      vy_max: 0.0                           # No lateral movement (diff drive)
      wz_max: 1.9                           # Higher angular vel — faster in-place rotation (rad/s)
      iteration_count: 3                    # More optimization each cycle
      prune_distance: 1.8                   # Re-align to refreshed path more aggressively (m)
      transform_tolerance: 0.2              # Tighter TF tolerance for responsive control
      temperature: 0.25                     # More sensitive / less random trajectory choice
      gamma: 0.015                          # Free energy term weight
      motion_model: "DiffDrive"             # Differential drive kinematics
      visualize: false
      regenerate_noises: false              # Reuse noise samples for speed
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # --- MPPI Critics ---
      # Each critic scores sampled trajectories; weighted sum determines best path
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]

      # Penalizes trajectories violating kinematic constraints
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # Penalizes distance from goal (activates near goal)
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4          # Only active within this distance (m)

      # Penalizes heading error at goal (activates very close to goal)
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.7

      # Penalizes reversing — high weight forces robot to rotate in place
      # then drive forward rather than backing up near walls
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0                   # Was 5.0 — strongly prefer forward motion
        threshold_to_consider: 0.5

      # Penalizes trajectories passing through high-cost costmap cells.
      # Now that local costmap has a proper inflation gradient (0.22→0.40m),
      # this critic actively steers MPPI away from walls before getting close.
      # Weight increased so the robot maintains clearance in open areas but
      # near_collision_cost kept high so it can still push through narrow gaps.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                    # Was 3.81 — stronger wall repulsion
        near_collision_cost: 240             # Only panic very close to lethal (253)
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      # Penalizes lateral deviation from the global path
      # HIGH weight = robot commits to the current path, won't oscillate
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0                   # Stronger path-locking behavior
        max_path_occupancy_ratio: 0.40      # Was 0.05 — still follow path even if 40% is in obstacles
        trajectory_point_step: 4
        threshold_to_consider: 0.2
        offset_from_furthest: 15
        use_path_orientations: false

      # Penalizes distance from the furthest reachable path point
      # Looks far ahead on the current path — anchors commitment to the chosen route
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0                   # Stronger pull to planned path
        offset_from_furthest: 15            # Slightly shorter look-ahead for quicker correction
        threshold_to_consider: 1.0

      # Penalizes heading deviation from path direction
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        offset_from_furthest: 6
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

# -----------------------------------------------------------------------------
# Local Costmap
# Small rolling window around the robot for reactive obstacle avoidance
# Uses tighter inflation so robot can squeeze through doorways
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0                 # Costmap update rate (Hz)
      publish_frequency: 2.0                # Costmap publish rate (Hz)
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true                  # Moves with robot
      width: 3                              # Window size (m)
      height: 3
      resolution: 0.05                      # Cell size (m) — matches SLAM
      robot_radius: 0.22                    # TB3 Waffle inscribed radius (m)
      plugins: ["obstacle_layer", "inflation_layer"]

      # Marks/clears cells based on laser scan observations
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0           # Max range for clearing (m)
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5           # Max range for marking (m)
          obstacle_min_range: 0.0

      # Inflates obstacles to create a safety buffer
      # CRITICAL for MPPI: the inflation zone IS the gradient that lets the
      # controller "feel" walls and steer away. Without it, cost jumps 0→253
      # with no transition and the robot drifts into lethal zones.
      #
      # Cost at distance d from obstacle:
      #   cost = 253 * exp(-5.0 * (d - 0.22))
      #   d=0.22m → 253 (lethal)    d=0.30m → 170    d=0.40m → 103
      # → smooth gradient from 0.22m to 0.40m that MPPI can follow
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0            # Moderate decay — gradient extends further
        inflation_radius: 0.1              # MPPI sees walls from 0.40m away
      always_send_full_costmap: True

# -----------------------------------------------------------------------------
# Global Costmap
# Full map used by the planner to compute paths to distant goals
# Slightly wider inflation than local so paths prefer open corridors when possible
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                 # Lower rate to save CPU
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # SMALLER than real radius (0.22m) on purpose!
      # This shrinks the inscribed lethal zone so the planner doesn't refuse
      # to plan when the robot is near a wall ("Start occupied" fix).
      # Real safety comes from local costmap (0.22m) + collision monitor.
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: true             # Mark unseen areas as unknown (for exploration)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # Subscribes to SLAM-generated map
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # Dynamic obstacles from laser scan
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # Wider inflation than local — planner prefers open paths but CAN plan
      # through narrow gaps when that's the only option
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Gentle decay so planner gets a smooth cost gradient.
        # Lower scaling = cost drops off more slowly from obstacles
        # → planner clearly "sees" walls from far away and routes around them
        cost_scaling_factor: 4.0
        # 0.40m > robot_radius (0.22m) → guaranteed gradient zone around all obstacles.
        # Doorway (0.8m): 0.8 - 2*0.22 = 0.36m clearance, within inflation but plannable.
        inflation_radius: 0.2

      always_send_full_costmap: True

# -----------------------------------------------------------------------------
# Map Saver
# Parameters for saving maps via map_saver_cli
# -----------------------------------------------------------------------------
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25               # Below this probability = free
    occupied_thresh_default: 0.65           # Above this probability = occupied
    map_subscribe_transient_local: True

# -----------------------------------------------------------------------------
# Planner Server (SmacPlanner2D)
# Computes global path from current position to goal on the global costmap
# Replaced NavFn because NavFn's gradient-descent path tracer fails when
# the robot is near obstacles and the cost gradient is too sharp/flat.
# SmacPlanner2D uses proper A* graph search — no gradient tracing issues.
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 1.0                        # Search up to 1.0m around goal for a free cell
      downsample_costmap: false             # Don't downsample — keep full resolution
      downsampling_factor: 1
      allow_unknown: true                   # Plan through unknown space (needed for exploration)
      max_iterations: 1000000               # Max A* search iterations
      max_on_approach_iterations: 1500      # More iterations near goal → finds reachable spot
      max_planning_time: 3.0                # Slightly more time for difficult goals (s)
      cost_travel_multiplier: 3.0           # Stronger obstacle avoidance during planning
      use_final_approach_orientation: false  # Let the controller handle final heading
      smoother:
        max_iterations: 1000
        w_smooth: 0.3                       # Smoothness weight
        w_data: 0.2                         # Data fidelity weight
        tolerance: 1.0e-10

# -----------------------------------------------------------------------------
# Smoother Server
# Smooths the global path to remove jagged edges
# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# -----------------------------------------------------------------------------
# Behavior Server
# Recovery behaviors when robot gets stuck (spin, backup, wait)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    # REDUCED from 2.0 — in tight spaces 2s lookahead makes backup/spin
    # think they'll collide and refuse to execute. 0.8s is enough to be safe
    # while still allowing recovery in narrow corridors.
    simulate_ahead_time: 0.8
    max_rotational_vel: 2.0                 # Spin recovery max speed (rad/s)
    min_rotational_vel: 0.2                 # Was 0.4 — slower spin for tight spaces
    rotational_acc_lim: 1.6

# -----------------------------------------------------------------------------
# Velocity Smoother
# Smooths commanded velocities to respect acceleration limits
# Prevents jerky starts/stops
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 25.0               # Match controller_frequency
    scale_velocities: False                 # Don't scale down — just clip
    feedback: "OPEN_LOOP"                   # No odometry feedback (simpler)
    max_velocity: [1.0, 0.0, 1.9]          # [vx, vy, wz] must match MPPI limits
    min_velocity: [-0.10, 0.0, -1.9]      # Must match MPPI vx_min / wz_max
    max_accel: [1.5, 0.0, 2.5]             # [ax, ay, az] m/s², m/s², rad/s²
    max_decel: [-1.5, 0.0, -2.5]           # Symmetric braking
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]     # No deadband
    velocity_timeout: 1.0                   # Stop if no cmd for this long (s)

# -----------------------------------------------------------------------------
# Collision Monitor
# Last line of defense — slows/stops robot if obstacle is imminent
# Uses the scan directly (not costmap) for fastest reaction
# -----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"    # Input from velocity_smoother
    cmd_vel_out_topic: "cmd_vel"            # Output to robot
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Two-zone collision protection:
    #   PolygonStop  → emergency hard stop at ~0.25s from impact (last resort)
    #   FootprintApproach → gentle slowdown at ~0.5s (normal avoidance)
    # In narrow corridors, approach zone lets robot creep through slowly
    # instead of freezing completely, while stop zone prevents actual crashes.
    polygons: [ "FootprintApproach"]
    # PolygonStop:
    #   type: "polygon"
    #   action_type: "stop"                   # HARD STOP — about to crash
    #   footprint_topic: "/local_costmap/published_footprint"
    #   time_before_collision: 0.25           # Only 0.25s — very close range
    #   simulation_time_step: 0.05
    #   min_points: 4
    #   visualize: False
    #   enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"               # Slow down proportionally
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.5            # Was 0.8 — less conservative
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
